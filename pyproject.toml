[project]
name = "memoria"
version = "0.1.0"
description = "Organic graph-based memory system for LLM agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.20",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[project.optional-dependencies]
scheduler = [
    "apscheduler>=3.10",
]
dev = [
    "polylith-cli>=1.45.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "polylith-cli>=1.45.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["components", "bases", "development", "."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
